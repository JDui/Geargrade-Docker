services:
  app:
    image: geargrade-docker-app:${APP_VERSION:-v0.9}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: geargrade-app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/geargrade.db}
      MEDIA_ROOT: ${MEDIA_ROOT:-./data/media}
      MEDIA_URL_PREFIX: ${MEDIA_URL_PREFIX:-/media}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - geargrade_data:/app/data
      - geargrade_media:/app/data/media
    ports:
      - "8080:8000"
    restart: unless-stopped

volumes:
  geargrade_data:
  geargrade_media:
